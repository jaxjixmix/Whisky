name: Release

on:
  release:
    types: [published]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # Optional: configure WEBHOOK in the fork's repository secrets.
      - name: Create Discord Embed
        continue-on-error: true
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.WEBHOOK }}
          embed-title: ${{ github.event.release.name }}
          embed-url: ${{ github.event.release.html_url }}
          embed-description: ${{ github.event.release.body }}
          embed-color: 9442302

      # This fork has no Homebrew cask. See docs/RELEASE.md.
